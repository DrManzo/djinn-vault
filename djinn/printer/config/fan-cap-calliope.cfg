# fan-cap-calliope.cfg
# M106 fan-speed cap — Calliope (Creality Ender-3 V3 Plus)
#
# BUG-014: The nozzle_mcu UART cable has known EMI susceptibility.
# M106 S255 at bridge infill generates an EMI spike that causes instant
# nozzle_mcu dropout and crashes the print. Hard cap at S128 (50%)
# eliminates this failure mode entirely.
#
# This macro intercepts ALL M106 commands at the Klipper level —
# regardless of source (slicer gcode, Fluidd console, Djinn scripts).
#
# Install: add [include fan-cap-calliope.cfg] to printer.cfg
# Do NOT modify the cap value without resolving BUG-014 first.
#
# Source basis:
#   - Klipper Command Templates — rename_existing, params, Jinja2:
#     https://www.klipper3d.org/Command_Templates.html
#   - Klipper Config Reference — [gcode_macro]:
#     https://www.klipper3d.org/Config_Reference.html#gcode_macro
#   - klipper/klippy/extras/gcode_macro.py — rename_existing implementation
#     (Klipper source, KevinOConnor et al)
#   - Community pattern reference: Voron sample-macros.cfg M117 override
#     (same rename_existing intercept pattern, adapted for M106)
# -----------------------------------------------------------------------

[gcode_macro M106]
description: Fan speed with S128 hard cap (BUG-014 nozzle_mcu EMI safety)
rename_existing: M106.1
gcode:
    {% set S_RAW = params.S | default(255) | int %}
    {% set S_SAFE = [S_RAW, 128] | min %}
    {% if params.P is defined %}
        {% if S_RAW > 128 %}
            { action_respond_info("M106 capped: S%d -> S128 (BUG-014 fan cap)" % S_RAW) }
        {% endif %}
        M106.1 S{S_SAFE} P{params.P}
    {% else %}
        {% if S_RAW > 128 %}
            { action_respond_info("M106 capped: S%d -> S128 (BUG-014 fan cap)" % S_RAW) }
        {% endif %}
        M106.1 S{S_SAFE}
    {% endif %}
