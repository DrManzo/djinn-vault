# plr.cfg — Power Loss Recovery for Ender-3 V3 Plus (Klipper/Nebula)
# Include in printer.cfg: [include plr.cfg]
# OrcaSlicer → Printer Settings → After layer change G-code:
#   SAVE_PLR_STATE LAYER={layer_num}

[save_variables]
filename: /usr/data/printer_data/config/plr_state.cfg

# ---------------------------------------------------------------------------
# Called by slicer at every layer change — saves Z + layer + filename
# ---------------------------------------------------------------------------
[gcode_macro SAVE_PLR_STATE]
description: Save layer position for power loss recovery
gcode:
  {% set cur_z    = printer.toolhead.position.z %}
  {% set cur_file = printer.print_stats.filename %}
  {% set layer    = params.LAYER|default(0)|int %}
  SAVE_VARIABLE VARIABLE=plr_z        VALUE={cur_z}
  SAVE_VARIABLE VARIABLE=plr_layer    VALUE={layer}
  SAVE_VARIABLE VARIABLE=plr_filename VALUE='"{cur_file}"'
  SAVE_VARIABLE VARIABLE=plr_active   VALUE=True

# ---------------------------------------------------------------------------
# Run at print start — reports if a recoverable state exists
# ---------------------------------------------------------------------------
[gcode_macro CHECK_PLR]
description: Report any saved PLR state
gcode:
  {% set sv = printer.save_variables.variables %}
  {% if sv.plr_active is defined and sv.plr_active %}
    {action_respond_info("PLR STATE FOUND")}
    {action_respond_info("  File : %s" % sv.plr_filename)}
    {action_respond_info("  Layer: %d   Z: %.2fmm" % (sv.plr_layer, sv.plr_z))}
    {action_respond_info("Run RESTORE_PLR to resume, or CLEAR_PLR to discard")}
  {% else %}
    {action_respond_info("PLR: no saved state")}
  {% endif %}

# ---------------------------------------------------------------------------
# Homes, heats, and lifts to the saved Z so you can set the nozzle
# on the stopped print, then reprint just the top slice
# ---------------------------------------------------------------------------
[gcode_macro RESTORE_PLR]
description: Home and move to saved PLR Z height
gcode:
  {% set sv = printer.save_variables.variables %}
  {% if sv.plr_active is defined and sv.plr_active %}
    {% set resume_z = sv.plr_z|float + 0.3 %}
    {action_respond_info("PLR: homing and moving to Z=%.2f" % resume_z)}
    G28
    BED_MESH_PROFILE LOAD=default
    M190 S60
    M109 S215
    G1 X150 Y150 Z{resume_z} F3000
    {action_respond_info("PLR: at resume position. Re-slice from Z=%.2f and start that file." % sv.plr_z)}
    CLEAR_PLR
  {% else %}
    {action_respond_info("PLR: no saved state to restore")}
  {% endif %}

# ---------------------------------------------------------------------------
# Called automatically at print end — wipes the saved state
# ---------------------------------------------------------------------------
[gcode_macro CLEAR_PLR]
description: Clear saved PLR state
gcode:
  SAVE_VARIABLE VARIABLE=plr_active   VALUE=False
  SAVE_VARIABLE VARIABLE=plr_z        VALUE=0
  SAVE_VARIABLE VARIABLE=plr_layer    VALUE=0
  SAVE_VARIABLE VARIABLE=plr_filename VALUE='""'

# ---------------------------------------------------------------------------
# Thermal watchdog — runs every 5 seconds, catches heater problems before
# Klipper's verify_heater 30-second hard-shutdown window triggers.
#
# Triggers a graceful PAUSE (saving PLR state) if:
#   1. Hotend drops >15°C below target while printing (heater losing power)
#   2. Hotend drops >10°C in a single 5-second interval (sudden failure)
#
# This fires even when idle (no-op), so no manual start needed.
# ---------------------------------------------------------------------------
[delayed_gcode thermal_watchdog]
initial_duration: 5
gcode:
  {% set sv     = printer.save_variables.variables %}
  {% set state  = printer.print_stats.state %}

  {% if state == "printing" %}
    {% set ext    = printer.extruder %}
    {% set temp   = ext.temperature|float %}
    {% set target = ext.target|float %}
    {% set prev   = sv.tw_prev|default(temp)|float %}
    {% set layer  = sv.plr_layer|default(0)|int %}

    SAVE_VARIABLE VARIABLE=tw_prev VALUE={temp}

    # --- Thermal: hotend too far below target ---
    {% if target > 150 and (target - temp) > 15 %}
      {% set msg = "THERMAL: hotend %.1f/%.0f C at layer %d" % (temp, target, layer) %}
      {action_respond_info("WATCHDOG: %s — pausing" % msg)}
      SAVE_PLR_STATE LAYER={layer}
      SAVE_VARIABLE VARIABLE=wd_pending_error VALUE='"{msg}"'
      PAUSE

    # --- Thermal: sudden drop > 10 C in 5 s ---
    {% elif target > 150 and (prev - temp) > 10 %}
      {% set msg = "THERMAL DROP: %.1f->%.1f C at layer %d" % (prev, temp, layer) %}
      {action_respond_info("WATCHDOG: %s — pausing" % msg)}
      SAVE_PLR_STATE LAYER={layer}
      SAVE_VARIABLE VARIABLE=wd_pending_error VALUE='"{msg}"'
      PAUSE

    # --- Bed: lost heat mid-print (>8 C below target) ---
    {% elif printer['heater_bed'].target > 0 and (printer['heater_bed'].target - printer['heater_bed'].temperature) > 8 %}
      {% set msg = "BED HEATER: %.1f/%.0f C at layer %d" % (printer['heater_bed'].temperature, printer['heater_bed'].target, layer) %}
      {action_respond_info("WATCHDOG: %s — pausing" % msg)}
      SAVE_PLR_STATE LAYER={layer}
      SAVE_VARIABLE VARIABLE=wd_pending_error VALUE='"{msg}"'
      PAUSE
    {% endif %}

  {% endif %}
  UPDATE_DELAYED_GCODE ID=thermal_watchdog DURATION=5
