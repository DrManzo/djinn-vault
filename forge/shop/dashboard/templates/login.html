<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typhon's Forge — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#0f1923; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .login-box { background:#1a2332; border:1px solid #2a3a4a; border-radius:10px; padding:2.5rem 2rem; width:320px; }
    h5 { color:#e8a020; font-weight:700; margin-bottom:1.5rem; }
    label { color:#7a9ab0; font-size:.82rem; }
    input { background:#0f1923; border:1px solid #2a3a4a; color:#d4e4f0; width:100%; padding:.5rem .75rem; border-radius:4px; margin-top:.25rem; margin-bottom:1rem; }
    input:focus { border-color:#e8a020; outline:none; }
    button { background:#e8a020; color:#000; font-weight:700; border:none; width:100%; padding:.6rem; border-radius:4px; cursor:pointer; }
    button:hover { background:#d09010; }
    .err { color:#e06060; font-size:.8rem; margin-bottom:.75rem; }
  </style>
</head>
<body>
  <div class="login-box">
    <h5>🔥 Typhon's Forge</h5>
    {% with messages = get_flashed_messages() %}
      {% if messages %}{% for m in messages %}<div class="err">{{ m }}</div>{% endfor %}{% endif %}
    {% endwith %}
    <form method="POST">
      <label>Password</label>
      <input type="password" name="password" autofocus>
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
