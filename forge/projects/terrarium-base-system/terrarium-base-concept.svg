<svg width="900" height="900" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .label { font-family: Arial, sans-serif; font-size: 16px; fill: #222; }
      .title { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #111; }
      .sub { font-family: Arial, sans-serif; font-size: 13px; fill: #555; }
      .part { stroke: #333; stroke-width: 2; }
    </style>
  </defs>

  <rect width="900" height="900" fill="#fafafa"/>
  <text x="450" y="45" text-anchor="middle" class="title">Modular 3-Part Base — Cross Section</text>
  <text x="450" y="68" text-anchor="middle" class="sub">Stackable drainage channels, seamless connection, interchangeable container on top</text>

  <!-- Container above (glass/PETG jar, cut off) -->
  <path d="M 320 160 L 320 260 Q 320 280 340 280 L 560 280 Q 580 280 580 260 L 580 160" fill="#d9f0f5" fill-opacity="0.4" stroke="#3aa0b5" stroke-width="3"/>
  <text x="450" y="140" text-anchor="middle" class="label">Interchangeable container (jar / dome / PETG vase-mode)</text>
  <text x="450" y="200" text-anchor="middle" class="sub">sits on universal connector ring below</text>

  <!-- Universal connector ring -->
  <ellipse cx="450" cy="290" rx="140" ry="18" fill="#efc94c" stroke="#8a6d1a" stroke-width="2"/>
  <text x="650" y="295" class="label">Universal connector ring</text>
  <text x="650" y="313" class="sub">(bayonet twist-lock, same on every container)</text>

  <!-- PART 1: Top base module - soil/moss shelf with drainage slots -->
  <rect x="300" y="300" width="300" height="90" rx="10" class="part" fill="#c9e4c5"/>
  <line x1="320" y1="330" x2="580" y2="330" stroke="#4a7a45" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="320" y1="360" x2="580" y2="360" stroke="#4a7a45" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="650" y="330" class="label">Part 1 — Planting shelf</text>
  <text x="650" y="348" class="sub">holds soil/moss; slotted floor lets</text>
  <text x="650" y="364" class="sub">water pass straight down, no basin here</text>

  <!-- connector between part 1 and 2 -->
  <ellipse cx="450" cy="390" rx="140" ry="14" fill="#efc94c" stroke="#8a6d1a" stroke-width="2"/>

  <!-- PART 2: Perforated riser / false floor -->
  <rect x="300" y="400" width="300" height="90" rx="10" class="part" fill="#f7e2a3"/>
  <g stroke="#8a6d1a" stroke-width="2">
    <line x1="330" y1="415" x2="330" y2="475"/>
    <line x1="380" y1="415" x2="380" y2="475"/>
    <line x1="430" y1="415" x2="430" y2="475"/>
    <line x1="480" y1="415" x2="480" y2="475"/>
    <line x1="530" y1="415" x2="530" y2="475"/>
    <line x1="570" y1="415" x2="570" y2="475"/>
  </g>
  <text x="650" y="430" class="label">Part 2 — Perforated riser</text>
  <text x="650" y="448" class="sub">false floor; channels align vertically</text>
  <text x="650" y="464" class="sub">with Part 1 so water drops straight through</text>

  <!-- connector between part 2 and 3 -->
  <ellipse cx="450" cy="490" rx="140" ry="14" fill="#efc94c" stroke="#8a6d1a" stroke-width="2"/>

  <!-- PART 3: Reservoir base -->
  <path d="M 300 500 L 300 570 Q 300 590 320 590 L 580 590 Q 600 590 600 570 L 600 500 Z" class="part" fill="#a9cbe0"/>
  <path d="M 320 545 L 580 545 L 580 570 Q 580 580 570 580 L 330 580 Q 320 580 320 570 Z" fill="#6fa8cc" fill-opacity="0.6"/>
  <text x="650" y="525" class="label">Part 3 — Water reservoir</text>
  <text x="650" y="543" class="sub">solid base holds standing water;</text>
  <text x="650" y="559" class="sub">this is the "hydro" layer</text>

  <!-- Side viewing port -->
  <rect x="590" y="555" width="18" height="20" fill="#dceefb" stroke="#3a7ca6" stroke-width="2"/>
  <line x1="608" y1="565" x2="660" y2="600" stroke="#3a7ca6" stroke-width="1.5"/>
  <text x="662" y="605" class="sub">optional side port —</text>
  <text x="662" y="620" class="sub">check water level w/o disassembly</text>

  <!-- Bottom connector ring to table/stand -->
  <ellipse cx="450" cy="592" rx="150" ry="16" fill="#efc94c" stroke="#8a6d1a" stroke-width="2"/>
  <text x="650" y="597" class="label">Bottom ring</text>
  <text x="650" y="613" class="sub">stackable — could mount to a printed stand,</text>
  <text x="650" y="629" class="sub">or cap flat for tabletop use</text>

  <!-- Downward arrow showing water path -->
  <path d="M 450 300 L 450 585" stroke="#1a5fa8" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a5fa8"/>
    </marker>
  </defs>
  <text x="230" y="450" text-anchor="end" class="label" fill="#1a5fa8">Water path</text>
  <text x="230" y="468" text-anchor="end" class="sub" fill="#1a5fa8">straight down through</text>
  <text x="230" y="482" text-anchor="end" class="sub" fill="#1a5fa8">aligned channels</text>

  <!-- Key/legend -->
  <rect x="60" y="680" width="780" height="180" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
  <text x="80" y="710" class="title" font-size="16">How it works</text>
  <text x="80" y="735" class="sub" font-size="14">• All 3 base parts share the same connector ring diameter — any part can stack on any other, in order.</text>
  <text x="80" y="757" class="sub" font-size="14">• Vertical drainage channels align between Part 1 and Part 2 so water isn't visible pooling — it just "disappears" downward.</text>
  <text x="80" y="779" class="sub" font-size="14">• Part 3's reservoir is the only sealed/solid section — this is what makes it semi-hydroponic (roots can wick moisture up).</text>
  <text x="80" y="801" class="sub" font-size="14">• Same universal ring on top connects to ANY container — apothecary jar, PETG vase-mode print, dome, etc.</text>
  <text x="80" y="823" class="sub" font-size="14">• Swap Part 3 depth (shallow vs deep reservoir) per plant type without touching the container or Parts 1–2.</text>
  <text x="80" y="845" class="sub" font-size="14">• Twist-lock (bayonet) recommended between all rings — quarter turn, no glue, fully disassembleable for cleaning.</text>
</svg>
