<svg width="1400" height="1600" viewBox="0 0 1400 1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .label { font-family: Arial, sans-serif; font-size: 15px; fill: #222; }
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #111; }
      .panel-title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #111; }
      .sub { font-family: Arial, sans-serif; font-size: 12px; fill: #555; }
      .dim { font-family: Arial, sans-serif; font-size: 12px; fill: #b03030; }
      .part1 { fill: #c9e4c5; stroke: #4a7a45; stroke-width: 2; }
      .part2 { fill: #f7e2a3; stroke: #8a6d1a; stroke-width: 2; }
      .part3 { fill: #a9cbe0; stroke: #2f6690; stroke-width: 2; }
      .ring { fill: #efc94c; stroke: #8a6d1a; stroke-width: 2; }
      .panelbox { fill: #ffffff; stroke: #ccc; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1400" height="1600" fill="#fafafa"/>
  <text x="700" y="45" text-anchor="middle" class="title">Modular Terrarium Base — Working Model Views</text>
  <text x="700" y="70" text-anchor="middle" class="sub">4 views: top-down, front elevation, exploded stack, full cross-section — approx scale, 100mm base diameter shown</text>

  <!-- ===================== PANEL 1: TOP VIEW ===================== -->
  <rect x="40" y="100" width="640" height="480" class="panelbox" rx="8"/>
  <text x="60" y="130" class="panel-title">1 — Top View (looking down into Part 1)</text>

  <circle cx="360" cy="350" r="200" fill="#c9e4c5" stroke="#4a7a45" stroke-width="3"/>
  <circle cx="360" cy="350" r="170" fill="#e8f4e6" stroke="#4a7a45" stroke-width="1.5" stroke-dasharray="5,4"/>
  <!-- drainage slots pattern -->
  <g stroke="#4a7a45" stroke-width="3">
    <line x1="220" y1="350" x2="260" y2="350"/>
    <line x1="460" y1="350" x2="500" y2="350"/>
    <line x1="360" y1="210" x2="360" y2="250"/>
    <line x1="360" y1="450" x2="360" y2="490"/>
    <line x1="255" y1="245" x2="285" y2="275"/>
    <line x1="435" y1="245" x2="465" y2="275"/>
    <line x1="255" y1="455" x2="285" y2="425"/>
    <line x1="435" y1="455" x2="465" y2="425"/>
  </g>
  <circle cx="360" cy="350" r="6" fill="#4a7a45"/>
  <!-- connector ring dashed outer -->
  <circle cx="360" cy="350" r="200" fill="none" stroke="#8a6d1a" stroke-width="3" stroke-dasharray="10,6"/>
  <text x="360" y="120" text-anchor="middle" class="dim">⌀ 200mm connector ring (bayonet lugs not shown)</text>

  <!-- dimension line -->
  <line x1="160" y1="580" x2="560" y2="580" stroke="#b03030" stroke-width="1.5"/>
  <line x1="160" y1="570" x2="160" y2="590" stroke="#b03030" stroke-width="1.5"/>
  <line x1="560" y1="570" x2="560" y2="590" stroke="#b03030" stroke-width="1.5"/>
  <text x="360" y="605" text-anchor="middle" class="dim">200mm outer diameter (scale to container size)</text>

  <text x="60" y="560" class="sub">8 radial drainage slots, 4mm wide — aligns with Part 2 below</text>

  <!-- ===================== PANEL 2: FRONT VIEW ===================== -->
  <rect x="720" y="100" width="640" height="480" class="panelbox" rx="8"/>
  <text x="740" y="130" class="panel-title">2 — Front Elevation (assembled, exterior)</text>

  <!-- container hint -->
  <path d="M 940 160 L 940 260 Q 940 280 960 280 L 1140 280 Q 1160 280 1160 260 L 1160 160" fill="#d9f0f5" fill-opacity="0.5" stroke="#3aa0b5" stroke-width="2.5"/>
  <text x="1050" y="150" text-anchor="middle" class="sub">container (swap freely)</text>

  <!-- ring -->
  <ellipse cx="1050" cy="288" rx="130" ry="14" class="ring"/>
  <!-- part 1 -->
  <rect x="920" y="290" width="260" height="70" class="part1"/>
  <!-- ring -->
  <ellipse cx="1050" cy="362" rx="130" ry="12" class="ring"/>
  <!-- part 2 -->
  <rect x="920" y="365" width="260" height="70" class="part2"/>
  <!-- ring -->
  <ellipse cx="1050" cy="437" rx="130" ry="12" class="ring"/>
  <!-- part 3 -->
  <path d="M 920 440 L 920 500 Q 920 515 935 515 L 1165 515 Q 1180 515 1180 500 L 1180 440 Z" class="part3"/>
  <!-- bottom ring -->
  <ellipse cx="1050" cy="517" rx="135" ry="13" class="ring"/>

  <text x="1200" y="325" class="label">Part 1</text>
  <text x="1200" y="400" class="label">Part 2</text>
  <text x="1200" y="480" class="label">Part 3</text>

  <!-- height dimension -->
  <line x1="890" y1="290" x2="890" y2="515" stroke="#b03030" stroke-width="1.5"/>
  <line x1="880" y1="290" x2="900" y2="290" stroke="#b03030" stroke-width="1.5"/>
  <line x1="880" y1="515" x2="900" y2="515" stroke="#b03030" stroke-width="1.5"/>
  <text x="860" y="405" text-anchor="middle" class="dim" transform="rotate(-90 860 405)">stack height ~75mm</text>

  <text x="740" y="560" class="sub">Rings at every seam are the SAME diameter — twist-lock, any part combines with any other.</text>

  <!-- ===================== PANEL 3: EXPLODED VIEW ===================== -->
  <rect x="40" y="620" width="640" height="560" class="panelbox" rx="8"/>
  <text x="60" y="650" class="panel-title">3 — Exploded View (assembly order, bottom to top)</text>

  <!-- container -->
  <path d="M 270 690 L 270 750 Q 270 765 285 765 L 435 765 Q 450 765 450 750 L 450 690" fill="#d9f0f5" fill-opacity="0.5" stroke="#3aa0b5" stroke-width="2"/>
  <text x="480" y="730" class="label">Container (jar / dome / print)</text>
  <text x="480" y="748" class="sub">interchangeable — same ring fit</text>

  <!-- gap -->
  <line x1="360" y1="770" x2="360" y2="800" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Part 1 -->
  <ellipse cx="360" cy="805" rx="90" ry="10" class="ring"/>
  <rect x="290" y="808" width="140" height="45" class="part1"/>
  <text x="480" y="825" class="label">Part 1 — Planting shelf</text>
  <text x="480" y="843" class="sub">soil/moss sits here, slotted floor</text>

  <line x1="360" y1="853" x2="360" y2="883" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Part 2 -->
  <ellipse cx="360" cy="888" rx="90" ry="10" class="ring"/>
  <rect x="290" y="891" width="140" height="45" class="part2"/>
  <g stroke="#8a6d1a" stroke-width="1.5">
    <line x1="310" y1="895" x2="310" y2="932"/>
    <line x1="335" y1="895" x2="335" y2="932"/>
    <line x1="360" y1="895" x2="360" y2="932"/>
    <line x1="385" y1="895" x2="385" y2="932"/>
    <line x1="410" y1="895" x2="410" y2="932"/>
  </g>
  <text x="480" y="908" class="label">Part 2 — Perforated riser</text>
  <text x="480" y="926" class="sub">false floor, channels aligned to Part 1</text>

  <line x1="360" y1="936" x2="360" y2="966" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Part 3 -->
  <ellipse cx="360" cy="971" rx="90" ry="10" class="ring"/>
  <path d="M 290 974 L 290 1015 Q 290 1025 300 1025 L 420 1025 Q 430 1025 430 1015 L 430 974 Z" class="part3"/>
  <text x="480" y="995" class="label">Part 3 — Water reservoir</text>
  <text x="480" y="1013" class="sub">sealed base, holds standing water</text>

  <ellipse cx="360" cy="1028" rx="95" ry="11" class="ring"/>
  <text x="480" y="1033" class="label">Bottom ring</text>
  <text x="480" y="1051" class="sub">flat cap for tabletop, or mounts to a stand</text>

  <text x="60" y="1090" class="sub">Dotted lines show assembly travel — each part twist-locks (quarter turn) onto the one below.</text>
  <text x="60" y="1108" class="sub">Disassemble in reverse for cleaning/water changes.</text>

  <!-- ===================== PANEL 4: CROSS SECTION ===================== -->
  <rect x="720" y="620" width="640" height="560" class="panelbox" rx="8"/>
  <text x="740" y="650" class="panel-title">4 — Full Cross-Section (delivery / water path)</text>

  <!-- container -->
  <path d="M 950 690 L 950 780 Q 950 800 970 800 L 1130 800 Q 1150 800 1150 780 L 1150 690" fill="#d9f0f5" fill-opacity="0.4" stroke="#3aa0b5" stroke-width="2.5"/>
  <!-- soil texture in container -->
  <ellipse cx="1050" cy="775" rx="95" ry="10" fill="#8a6240" fill-opacity="0.5"/>
  <text x="1160" y="720" class="sub">plant + soil</text>

  <ellipse cx="1050" cy="805" rx="100" ry="12" class="ring"/>

  <!-- Part 1 cross section -->
  <rect x="950" y="808" width="200" height="60" class="part1"/>
  <line x1="980" y1="820" x2="980" y2="868" stroke="#4a7a45" stroke-width="4"/>
  <line x1="1120" y1="820" x2="1120" y2="868" stroke="#4a7a45" stroke-width="4"/>
  <text x="1160" y="840" class="label" font-size="13">Part 1</text>
  <text x="1160" y="856" class="sub">open slots, no basin</text>

  <ellipse cx="1050" cy="871" rx="100" ry="11" class="ring"/>

  <!-- Part 2 cross section -->
  <rect x="950" y="874" width="200" height="60" class="part2"/>
  <line x1="980" y1="886" x2="980" y2="934" stroke="#8a6d1a" stroke-width="4"/>
  <line x1="1120" y1="886" x2="1120" y2="934" stroke="#8a6d1a" stroke-width="4"/>
  <text x="1160" y="906" class="label" font-size="13">Part 2</text>
  <text x="1160" y="922" class="sub">channels align w/ Part 1</text>

  <ellipse cx="1050" cy="937" rx="100" ry="11" class="ring"/>

  <!-- Part 3 cross section -->
  <path d="M 950 940 L 950 1010 Q 950 1025 965 1025 L 1135 1025 Q 1150 1025 1150 1010 L 1150 940 Z" class="part3"/>
  <path d="M 965 995 L 1135 995 L 1135 1010 Q 1135 1018 1125 1018 L 975 1018 Q 965 1018 965 1010 Z" fill="#5a9bc4" fill-opacity="0.6"/>
  <text x="1160" y="970" class="label" font-size="13">Part 3</text>
  <text x="1160" y="986" class="sub">sealed reservoir,</text>
  <text x="1160" y="1000" class="sub">standing water line shown</text>

  <!-- water path arrow -->
  <path d="M 1050 810 L 1050 1010" stroke="#1a5fa8" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a5fa8"/>
    </marker>
  </defs>
  <text x="900" y="920" text-anchor="end" class="dim" fill="#1a5fa8">water path</text>

  <ellipse cx="1050" cy="1028" rx="103" ry="12" class="ring"/>

  <text x="740" y="1080" class="sub">This is the view to hand off for delivery — shows exactly where each</text>
  <text x="740" y="1098" class="sub">seam sits, wall thickness at cut lines, and where water actually collects.</text>

  <!-- ===================== NOTES BAR ===================== -->
  <rect x="40" y="1200" width="1320" height="360" class="panelbox" rx="8"/>
  <text x="60" y="1230" class="panel-title">Print / delivery notes</text>
  <text x="60" y="1260" class="label" font-size="14">• Wall thickness: 2.4mm minimum (6 perimeters at 0.4mm nozzle) on Part 3 reservoir — this is the only part that must hold water long-term.</text>
  <text x="60" y="1284" class="label" font-size="14">• Parts 1 &amp; 2 can be thinner (2 perimeters, ~1.2mm) since they don't hold standing water directly.</text>
  <text x="60" y="1308" class="label" font-size="14">• Bayonet lugs: 3 lugs per ring, 8mm wide, 120° apart — quarter turn to lock, same spec on every ring so any part fits any other.</text>
  <text x="60" y="1332" class="label" font-size="14">• Print orientation: Parts 1 &amp; 2 print flat (floor down) for slot accuracy. Part 3 prints upright for the reservoir seal — vase mode if no side port.</text>
  <text x="60" y="1356" class="label" font-size="14">• Clear PETG for container + Part 1 (visible layers become part of the aesthetic). Part 3 can be opaque PETG — it's hidden under soil anyway.</text>
  <text x="60" y="1380" class="label" font-size="14">• Test print first at 100mm diameter (as drawn) before scaling to your actual apothecary jar's mouth diameter — measure that first.</text>
  <text x="60" y="1410" class="label" font-size="14">Next step: give me the actual mouth diameter of your apothecary jar and I'll resize these dimensions to match it exactly.</text>
</svg>
